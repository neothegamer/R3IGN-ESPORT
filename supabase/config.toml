
[functions.tiktok-login-start]
enabled = true
verify_jwt = false
import_map = "./functions/tiktok-login-start/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/tiktok-login-start/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/tiktok-login-start/*.html" ]

[functions.tiktok-token-proxy]
enabled = true
verify_jwt = false
import_map = "./functions/tiktok-token-proxy/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/tiktok-token-proxy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/tiktok-token-proxy/*.html" ]
